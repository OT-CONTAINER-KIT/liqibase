name: Database migrations

on:
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'liquibase.properties'
  workflow_dispatch:

permissions:
  contents: read

# Finish the current DEV → UAT → PROD release before starting another.
concurrency:
  group: database-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Liquibase runs inside one container per job on the self-hosted runner.
# Image: liquibase/liquibase:5.0.4 plus PostgreSQL JDBC 42.7.14 (see Dockerfile).
# The migration sequence (validate, update-sql, tag, update, status) lives in
# one reusable composite action, .github/actions/liquibase-migrate, so the three
# jobs below differ only by environment. The rollback sequence lives in
# .github/actions/liquibase-rollback. The repo checkout is mounted into the
# container, so it always runs the changelog from this exact commit.

jobs:
  dev:
    runs-on: [self-hosted, Linux, X64, liquibase-rds]
    timeout-minutes: 30
    environment: dev
    env:
      LIQ_IMAGE: liquibase-lab:5.0.4
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${{ vars.DB_HOST }}:${{ vars.DB_PORT || '5432' }}/${{ vars.DB_NAME }}?sslmode=require&currentSchema=${{ vars.DB_SCHEMA || 'app' }}&connectTimeout=15
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USERNAME }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: ${{ vars.DB_SCHEMA || 'app' }}
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: ${{ vars.DB_SCHEMA || 'app' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build Liquibase image
        run: docker build -t "$LIQ_IMAGE" .
      - name: Migrate DEV
        uses: ./.github/actions/liquibase-migrate
        with:
          image: ${{ env.LIQ_IMAGE }}
          rollback_tag: before-${{ github.run_id }}-${{ github.run_attempt }}

  uat:
    needs: dev
    runs-on: [self-hosted, Linux, X64, liquibase-rds]
    timeout-minutes: 30
    environment: uat
    env:
      LIQ_IMAGE: liquibase-lab:5.0.4
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${{ vars.DB_HOST }}:${{ vars.DB_PORT || '5432' }}/${{ vars.DB_NAME }}?sslmode=require&currentSchema=${{ vars.DB_SCHEMA || 'app' }}&connectTimeout=15
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USERNAME }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: ${{ vars.DB_SCHEMA || 'app' }}
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: ${{ vars.DB_SCHEMA || 'app' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build Liquibase image
        run: docker build -t "$LIQ_IMAGE" .
      - name: Migrate UAT
        uses: ./.github/actions/liquibase-migrate
        with:
          image: ${{ env.LIQ_IMAGE }}
          rollback_tag: before-${{ github.run_id }}-${{ github.run_attempt }}

  prod:
    needs: uat
    runs-on: [self-hosted, Linux, X64, liquibase-rds]
    timeout-minutes: 30
    environment: prod
    env:
      LIQ_IMAGE: liquibase-lab:5.0.4
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${{ vars.DB_HOST }}:${{ vars.DB_PORT || '5432' }}/${{ vars.DB_NAME }}?sslmode=require&currentSchema=${{ vars.DB_SCHEMA || 'app' }}&connectTimeout=15
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USERNAME }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
      LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: ${{ vars.DB_SCHEMA || 'app' }}
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: ${{ vars.DB_SCHEMA || 'app' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build Liquibase image
        run: docker build -t "$LIQ_IMAGE" .
      - name: Migrate PROD
        uses: ./.github/actions/liquibase-migrate
        with:
          image: ${{ env.LIQ_IMAGE }}
          rollback_tag: before-${{ github.run_id }}-${{ github.run_attempt }}
